name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore HotlineValetudo.sln

      - name: Build
        run: dotnet build HotlineValetudo.sln --no-restore

      - name: Test
        run: dotnet test HotlineValetudo.sln --no-build

      - name: Publish self-contained
        run: dotnet publish HotlineValetudo/HotlineValetudo.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true --no-build -o publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hotlinevaletudo-${{ matrix.rid }}
          path: publish/
